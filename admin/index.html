<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Portfolio</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .admin-wrap { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .login-box { max-width: 360px; margin: 80px auto; background: #fff; padding: 30px; border: 1px solid #e2e2e2; border-radius: 6px; }
    .login-box h2 { margin-bottom: 16px; }
    .login-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #e2e2e2; border-radius: 4px; }
    .login-box button { width: 100%; padding: 10px; background: #1e73be; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }
    .form-row input, .form-row textarea { width: 100%; padding: 10px; border: 1px solid #e2e2e2; border-radius: 4px; font-family: inherit; }
    .form-row textarea { min-height: 80px; }
    .btn-row { display: flex; gap: 10px; }
    .btn-secondary { background: #666; color: #fff; padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-danger { background: #c0392b; color: #fff; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .project-list { margin-top: 30px; }
    .project-item { background: #fff; border: 1px solid #e2e2e2; padding: 14px; margin-bottom: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .project-item h4 { margin: 0; }
    .project-item p { margin: 4px 0 0; color: #666; font-size: 0.9rem; }
    .hidden { display: none; }
    .msg { padding: 10px; margin-bottom: 14px; border-radius: 4px; }
    .msg.ok { background: #eaf5ea; color: #2e7d32; }
    .msg.err { background: #fdecea; color: #c62828; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../index.html">Portfolio Admin</a>
    </div>
  </header>

  <div id="loginView" class="login-box">
    <h2>Admin Login</h2>
    <input type="password" id="pwd" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="loginMsg" style="color:#c62828;margin-top:10px;"></p>
  </div>

  <div id="adminView" class="admin-wrap hidden">
    <h2>Manage Projects</h2>
    <div id="msg"></div>
    <form id="projectForm">
      <div class="form-row"><label>Title</label><input id="title" required></div>
      <div class="form-row"><label>Description</label><textarea id="description"></textarea></div>
      <div class="form-row"><label>Image URL</label><input id="image" placeholder="https://..."></div>
      <div class="form-row"><label>Live Link</label><input id="link"></div>
      <div class="form-row"><label>Code/Repo Link</label><input id="repo"></div>
      <div class="form-row"><label>Tags (comma separated)</label><input id="tags"></div>
      <input type="hidden" id="editId">
      <div class="btn-row">
        <button type="submit">Save Project</button>
        <button type="button" class="btn-secondary" id="cancelEdit">Cancel</button>
        <button type="button" class="btn-secondary" id="logoutBtn">Logout</button>
      </div>
    </form>

    <div class="project-list" id="projectList"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
